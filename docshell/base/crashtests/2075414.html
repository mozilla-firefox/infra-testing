<!DOCTYPE html>
<html class="reftest-wait">
<iframe id="a"></iframe>
<script>
window.onload = () => {
  a.srcdoc = "x";
  setTimeout(() => {
    if (performance.getEntriesByType("navigation")[0].type != "reload") {
      location.reload(true);
    } else {
      document.documentElement.classList.remove("reftest-wait");
    }
  }, 0);
};
</script>
</html>
